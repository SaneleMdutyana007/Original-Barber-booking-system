<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <!--
      CSP delivered via meta tag. Note: frame-ancestors is deliberately omitted
      because browsers ignore it in meta tags — it only works as an HTTP header.
      Set frame-ancestors in your host (Vercel/Netlify) at deploy time.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https://*.supabase.co https://www.google-analytics.com https://www.googletagmanager.com;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://www.google-analytics.com https://www.googletagmanager.com;
        frame-src https://www.google.com https://maps.google.com https://www.payfast.co.za https://sandbox.payfast.co.za;
        form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za;
        base-uri 'self';
        object-src 'none';" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <title>BarberShop ZA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
